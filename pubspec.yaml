name: custom_date_range_plus
description: A theme-aware Flutter date range picker with inline and dialog layouts, inclusive date limits, localized calendars, and customizable controls.
version: 0.1.0
homepage: https://github.com/dartpilot0017/custom_date_range_picker
repository: https://github.com/dartpilot0017/custom_date_range_picker
issue_tracker: https://github.com/dartpilot0017/custom_date_range_picker/issues
topics:
  - date-picker
  - date-range
  - calendar
  - widgets

environment:
  sdk: ^3.6.1
  flutter: '>=3.27.2'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
